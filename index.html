<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#000000">

    <title>3D Space Sphere</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            overscroll-behavior: none;
        }

        /* =====================================================
       APP
       ===================================================== */

        #app {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        /* =====================================================
       VIEWER
       ===================================================== */

        #viewer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;

            cursor: grab;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;

            overscroll-behavior: none;
        }

        #viewer.dragging {
            cursor: none;
        }

        #viewer canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* =====================================================
       VIEW STATUS
       ===================================================== */

        #viewStatus {
            position: absolute;

            top: 15px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 80;

            padding:
                8px 14px;

            border-radius:
                999px;

            color:
                rgba(255, 255, 255, .9);

            background:
                rgba(0, 0, 0, .36);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                .5px;

            pointer-events:
                none;

            user-select:
                none;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, .9);
        }

        /* =====================================================
       SENSOR STATUS
       ===================================================== */

        #sensorStatus {
            position: absolute;

            top: 51px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 80;

            padding:
                7px 12px;

            border-radius:
                999px;

            color:
                rgba(255, 255, 255, .84);

            background:
                rgba(0, 0, 0, .30);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            font-size:
                11px;

            pointer-events:
                none;

            user-select:
                none;

            display:
                none;
        }

        /* =====================================================
       LOADING
       ===================================================== */

        #loading {
            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            color: #fff;

            padding: 25px;

            text-align: center;

            font-size: 15px;

            background:
                rgba(0, 0, 0, .72);

            z-index: 200;

            pointer-events:
                none;

            opacity: 1;

            transition:
                opacity .25s ease;
        }

        #loading.hidden {
            opacity: 0;
        }

        /* =====================================================
       ERROR
       ===================================================== */

        #error {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(90%, 650px);

            padding:
                22px;

            border-radius:
                14px;

            color:
                white;

            background:
                rgba(25, 0, 0, .95);

            text-align:
                center;

            line-height:
                1.5;

            display:
                none;

            z-index:
                300;
        }

        #error code {
            font-family:
                Consolas,
                monospace;
        }

        /* =====================================================
       TOAST
       ===================================================== */

        #toast {
            position: absolute;

            left: 50%;
            bottom: 188px;

            transform:
                translate(-50%, 15px);

            z-index: 500;

            max-width:
                min(90vw, 560px);

            padding:
                11px 15px;

            border-radius:
                12px;

            color:
                #fff;

            background:
                rgba(0, 0, 0, .76);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .35);

            font-size:
                12px;

            text-align:
                center;

            opacity:
                0;

            pointer-events:
                none;

            transition:
                opacity .2s ease,
                transform .2s ease;
        }

        #toast.show {
            opacity:
                1;

            transform:
                translate(-50%, 0);
        }

        /* =====================================================
       BOTTOM UI
       ===================================================== */

        .ui {
            position: absolute;

            left: 50%;
            bottom: 18px;

            transform:
                translateX(-50%);

            width:
                min(94vw, 620px);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                8px;

            z-index:
                100;

            pointer-events:
                none;
        }

        .title {
            color:
                rgba(255, 255, 255, .88);

            font-size:
                13px;

            line-height:
                1.35;

            text-align:
                center;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, .95);

            user-select:
                none;
        }

        .control-row {
            width:
                100%;

            display:
                flex;

            flex-wrap:
                wrap;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            pointer-events:
                auto;
        }

        button {
            border:
                0;

            outline:
                none;

            min-height:
                44px;

            padding:
                11px 16px;

            border-radius:
                12px;

            cursor:
                pointer;

            background:
                rgba(255, 255, 255, .95);

            color:
                #111;

            font-size:
                13px;

            font-weight:
                700;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .45),

                inset 0 1px 0 rgba(255, 255, 255, .85);

            transition:
                transform .15s ease,
                background .15s ease,
                opacity .15s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        button:hover {
            transform:
                translateY(-2px);

            background:
                #fff;
        }

        button:active {
            transform:
                translateY(0);
        }

        button:disabled {
            opacity:
                .45;

            cursor:
                not-allowed;

            transform:
                none;
        }

        /* =====================================================
       DISTANCE CONTROL
       ===================================================== */

        #distanceSection {
            width:
                min(100%, 490px);

            padding:
                10px 15px;

            border-radius:
                14px;

            background:
                rgba(0, 0, 0, .40);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .25);

            pointer-events:
                auto;

            /*
        Smooth visibility when changing view.
      */

            opacity:
                1;

            transform:
                translateY(0);

            transition:
                opacity .2s ease,
                transform .2s ease;
        }

        #distanceSection.hidden {
            opacity:
                0;

            transform:
                translateY(8px);

            pointer-events:
                none;

            visibility:
                hidden;
        }

        .distance-header {
            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                6px;
        }

        .distance-label {
            color:
                white;

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                .3px;
        }

        .distance-value {
            color:
                rgba(255, 255, 255, .75);

            font-size:
                11px;
        }

        #distanceSlider {
            display:
                block;

            width:
                100%;

            margin:
                0;

            cursor:
                pointer;

            accent-color:
                white;
        }

        /* =====================================================
       INPUTS
       ===================================================== */

        #imageInput,
        #videoInput {
            display:
                none;
        }

        /* =====================================================
       MOBILE
       ===================================================== */

        @media (max-width:600px) {

            .ui {
                width:
                    calc(100vw - 14px);

                bottom:
                    9px;

                gap:
                    6px;
            }

            .title {
                font-size:
                    11px;
            }

            .control-row {
                gap:
                    6px;
            }

            button {
                flex:
                    1 1 auto;

                min-height:
                    42px;

                padding:
                    9px 10px;

                font-size:
                    11px;
            }

            #distanceSection {
                padding:
                    8px 11px;
            }

            #viewStatus {
                top:
                    9px;

                font-size:
                    10px;
            }

            #sensorStatus {
                top:
                    40px;

                font-size:
                    10px;
            }

            #toast {
                bottom:
                    205px;

                font-size:
                    11px;
            }

        }
    </style>
</head>

<body>

    <div id="app">

        <!-- ===================================================
       3D VIEWER
       =================================================== -->

        <div id="viewer"></div>


        <!-- ===================================================
       VIEW STATUS
       =================================================== -->

        <div id="viewStatus">
            INSIDE VIEW
        </div>


        <div id="sensorStatus">
            MOTION SENSOR ACTIVE
        </div>


        <!-- ===================================================
       LOADING
       =================================================== -->

        <div id="loading">
            Loading...
        </div>


        <!-- ===================================================
       ERROR
       =================================================== -->

        <div id="error"></div>


        <!-- ===================================================
       TOAST
       =================================================== -->

        <div id="toast"></div>


        <!-- ===================================================
       CONTROLS
       =================================================== -->

        <div class="ui">

            <div class="title">
                Hold Left Mouse Button + Move • Touch & Drag
            </div>


            <!-- =================================================
         DISTANCE — INSIDE ONLY
         ================================================= -->

            <div id="distanceSection">

                <div class="distance-header">

                    <div class="distance-label">
                        Space Distance
                    </div>

                    <div id="distanceValue" class="distance-value">
                        50
                    </div>

                </div>

                <input id="distanceSlider" type="range" min="0" max="100" value="50" step="1">

            </div>


            <!-- =================================================
         VIEW + SENSOR
         ================================================= -->

            <div class="control-row">

                <button id="viewToggleBtn">
                    Switch to Outside
                </button>

                <button id="sensorBtn">
                    Enable Motion
                </button>

            </div>


            <!-- =================================================
         MEDIA
         ================================================= -->

            <div class="control-row">

                <button id="imageBtn">
                    Choose Space Image
                </button>

                <button id="videoBtn">
                    Choose Video(s)
                </button>

            </div>


            <!-- =================================================
         DOWNLOAD
         ================================================= -->

            <div class="control-row">

                <button id="downloadBtn">
                    Download Space Sphere (.GLB)
                </button>

            </div>

        </div>


        <!-- ===================================================
       FILE INPUTS
       =================================================== -->

        <input id="imageInput" type="file" accept="image/*">

        <input id="videoInput" type="file" accept="video/*" multiple>

    </div>


    <!-- =====================================================
     THREE.JS
     ===================================================== -->

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


    <script type="module">

        import * as THREE from "three";

        import {
            GLTFExporter
        } from
            "three/addons/exporters/GLTFExporter.js";


        // =========================================================
        // SERVICE WORKER
        // =========================================================

        if (
            "serviceWorker" in navigator &&
            (
                location.protocol === "http:" ||
                location.protocol === "https:"
            )
        ) {

            navigator.serviceWorker
                .register(
                    "./sw.js",
                    {
                        scope: "./"
                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "Service worker:",
                            error
                        );

                    }
                );

        }


        // =========================================================
        // DOM
        // =========================================================

        const viewer =
            document.getElementById(
                "viewer"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const errorBox =
            document.getElementById(
                "error"
            );

        const toast =
            document.getElementById(
                "toast"
            );

        const viewStatus =
            document.getElementById(
                "viewStatus"
            );

        const sensorStatus =
            document.getElementById(
                "sensorStatus"
            );

        const viewToggleBtn =
            document.getElementById(
                "viewToggleBtn"
            );

        const sensorBtn =
            document.getElementById(
                "sensorBtn"
            );

        const imageBtn =
            document.getElementById(
                "imageBtn"
            );

        const videoBtn =
            document.getElementById(
                "videoBtn"
            );

        const imageInput =
            document.getElementById(
                "imageInput"
            );

        const videoInput =
            document.getElementById(
                "videoInput"
            );

        const downloadBtn =
            document.getElementById(
                "downloadBtn"
            );

        const distanceSection =
            document.getElementById(
                "distanceSection"
            );

        const distanceSlider =
            document.getElementById(
                "distanceSlider"
            );

        const distanceValue =
            document.getElementById(
                "distanceValue"
            );


        // =========================================================
        // THREE.JS
        // =========================================================

        const scene =
            new THREE.Scene();


        const camera =
            new THREE.PerspectiveCamera(
                60,
                window.innerWidth /
                window.innerHeight,
                0.01,
                10000
            );


        camera.position.set(
            0,
            0,
            0.01
        );


        const renderer =
            new THREE.WebGLRenderer({

                antialias:
                    true,

                powerPreference:
                    "high-performance",

                preserveDrawingBuffer:
                    true,

                alpha:
                    false

            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
            1.0;


        viewer.appendChild(
            renderer.domElement
        );


        // =========================================================
        // GLOBAL STATE
        // =========================================================

        let insideView =
            true;


        let mediaMode =
            "image";


        let currentTexture =
            null;


        let insideSphere =
            null;


        let outsideSphere =
            null;


        let currentRadius =
            50;


        // =========================================================
        // CAMERA STATE
        // =========================================================

        let yaw =
            0;


        let pitch =
            0;


        let orbitYaw =
            0;


        let orbitPitch =
            0;


        const mouseSensitivity =
            0.0025;


        let isDragging =
            false;


        let activePointerId =
            null;


        let lastPointerX =
            0;


        let lastPointerY =
            0;


        // =========================================================
        // SENSOR STATE
        // =========================================================

        const sensorAvailable =
            "DeviceOrientationEvent"
            in window;


        let sensorEnabled =
            false;


        let sensorInitialized =
            false;


        let sensorQuaternion =
            new THREE.Quaternion();


        let sensorReference =
            new THREE.Quaternion();


        const deviceEuler =
            new THREE.Euler(
                0,
                0,
                0,
                "YXZ"
            );


        const deviceQuaternion =
            new THREE.Quaternion();


        const screenQuaternion =
            new THREE.Quaternion();


        const correctionQuaternion =
            new THREE.Quaternion();


        const axisX =
            new THREE.Vector3(
                1,
                0,
                0
            );


        const axisZ =
            new THREE.Vector3(
                0,
                0,
                1
            );


        let screenAngle =
            0;


        // =========================================================
        // VIDEO
        // =========================================================

        let videoFiles =
            [];

        let videoURLs =
            [];

        let currentVideoIndex =
            0;

        let currentVideo =
            null;

        let currentVideoTexture =
            null;


        // =========================================================
        // LOADING
        // =========================================================

        let loadingTimer =
            null;


        function showLoading(
            text = "Loading..."
        ) {

            clearTimeout(
                loadingTimer
            );


            loading.textContent =
                text;


            loading.style.display =
                "flex";


            loading.classList.remove(
                "hidden"
            );


            loadingTimer =
                setTimeout(
                    hideLoading,
                    10000
                );

        }


        function hideLoading() {

            clearTimeout(
                loadingTimer
            );


            loading.classList.add(
                "hidden"
            );


            setTimeout(
                () => {

                    loading.style.display =
                        "none";

                },
                260
            );

        }


        // =========================================================
        // TOAST
        // =========================================================

        let toastTimer =
            null;


        function showToast(
            message,
            duration = 3000
        ) {

            clearTimeout(
                toastTimer
            );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    duration
                );

        }


        // =========================================================
        // POINTER DOWN
        // =========================================================

        viewer.addEventListener(
            "pointerdown",
            async event => {

                /*
                  Desktop:
                  left button only.
            
                  Touch:
                  allowed.
                */

                if (
                    event.pointerType === "mouse" &&
                    event.button !== 0
                ) {

                    return;

                }


                event.preventDefault();


                isDragging =
                    true;


                activePointerId =
                    event.pointerId;


                lastPointerX =
                    event.clientX;


                lastPointerY =
                    event.clientY;


                viewer.classList.add(
                    "dragging"
                );


                if (
                    event.pointerType === "touch"
                ) {

                    try {

                        viewer.setPointerCapture(
                            event.pointerId
                        );

                    }
                    catch (_) { }


                    return;

                }


                /*
                  Desktop Pointer Lock.
                */

                try {

                    if (
                        document.pointerLockElement !==
                        viewer
                    ) {

                        await viewer.requestPointerLock();

                    }

                }

                catch (_) { }

            }
        );


        // =========================================================
        // POINTER MOVE
        // =========================================================

        viewer.addEventListener(
            "pointermove",
            event => {

                if (
                    !isDragging
                ) {

                    return;

                }


                if (
                    activePointerId !== null &&
                    event.pointerId !==
                    activePointerId
                ) {

                    return;

                }


                let dx =
                    0;


                let dy =
                    0;


                /*
                  Pointer Lock.
                */

                if (
                    document.pointerLockElement ===
                    viewer
                ) {

                    dx =
                        event.movementX;


                    dy =
                        event.movementY;

                }

                /*
                  Touch / fallback.
                */

                else {

                    dx =
                        event.clientX -
                        lastPointerX;


                    dy =
                        event.clientY -
                        lastPointerY;


                    lastPointerX =
                        event.clientX;


                    lastPointerY =
                        event.clientY;

                }


                if (
                    insideView
                ) {

                    yaw -=
                        dx *
                        mouseSensitivity;


                    pitch -=
                        dy *
                        mouseSensitivity;


                    yaw %=
                        Math.PI * 2;


                    pitch %=
                        Math.PI * 2;


                    applyInsideCamera();

                }

                else {

                    orbitYaw -=
                        dx *
                        mouseSensitivity;


                    orbitPitch -=
                        dy *
                        mouseSensitivity;


                    const poleLimit =
                        Math.PI / 2 -
                        0.02;


                    orbitPitch =
                        Math.max(
                            -poleLimit,
                            Math.min(
                                poleLimit,
                                orbitPitch
                            )
                        );


                    applyOutsideCamera();

                }

            }
        );


        // =========================================================
        // POINTER RELEASE
        // =========================================================

        viewer.addEventListener(
            "pointerup",
            event => {

                stopDragging(
                    event.pointerId
                );

            }
        );


        viewer.addEventListener(
            "pointercancel",
            event => {

                stopDragging(
                    event.pointerId
                );

            }
        );


        window.addEventListener(
            "mouseup",
            event => {

                if (
                    event.button === 0
                ) {

                    stopDragging();

                }

            }
        );


        window.addEventListener(
            "blur",
            () => {

                stopDragging();

            }
        );


        document.addEventListener(
            "pointerlockchange",
            () => {

                if (
                    document.pointerLockElement !==
                    viewer
                ) {

                    viewer.classList.remove(
                        "dragging"
                    );

                }

            }
        );


        viewer.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );


        function stopDragging(
            pointerId = null
        ) {

            isDragging =
                false;


            activePointerId =
                null;


            viewer.classList.remove(
                "dragging"
            );


            if (
                pointerId !== null
            ) {

                try {

                    viewer.releasePointerCapture(
                        pointerId
                    );

                }
                catch (_) { }

            }


            if (
                document.pointerLockElement ===
                viewer
            ) {

                try {

                    document.exitPointerLock();

                }
                catch (_) { }

            }

        }


        // =========================================================
        // INSIDE CAMERA
        // =========================================================

        function applyInsideCamera() {

            camera.position.set(
                0,
                0,
                0.01
            );


            camera.rotation.order =
                "YXZ";


            camera.rotation.y =
                yaw;


            camera.rotation.x =
                pitch;

        }


        // =========================================================
        // OUTSIDE CAMERA
        // =========================================================

        function applyOutsideCamera() {

            if (
                !outsideSphere
            ) {

                return;

            }


            /*
              IMPORTANT:
          
              The sphere NEVER moves.
          
              Camera orbits around the sphere's center.
            */

            const radius =
                Math.max(
                    currentRadius,
                    1
                );


            /*
              Keep a comfortable amount of space around
              the actual sphere.
            */

            const distance =
                radius * 3.4;


            const cosPitch =
                Math.cos(
                    orbitPitch
                );


            const sinPitch =
                Math.sin(
                    orbitPitch
                );


            const sinYaw =
                Math.sin(
                    orbitYaw
                );


            const cosYaw =
                Math.cos(
                    orbitYaw
                );


            camera.position.set(

                distance *
                cosPitch *
                sinYaw,

                distance *
                sinPitch,

                distance *
                cosPitch *
                cosYaw

            );


            /*
              Always target the exact sphere center.
            */

            camera.lookAt(
                0,
                0,
                0
            );

        }


        // =========================================================
        // DISTANCE SYSTEM
        // =========================================================
        //
        // IMPORTANT:
        //
        // Sphere radius DOES NOT alter how a panorama looks when
        // the camera is exactly at its center.
        //
        // So the slider controls the OPTICAL distance effect.
        //
        // 0:
        //   closer / larger feeling
        //
        // 100:
        //   farther / smaller feeling
        //
        // It also changes the sphere radius so Outside View
        // retains a meaningful physical scale when toggled.
        // =========================================================

        function updateInsideDistance() {

            if (
                !insideView
            ) {

                return;

            }


            const value =
                Number(
                    distanceSlider.value
                );


            distanceValue.textContent =
                value;


            /*
              Map 0–100 onto a very obvious FOV range.
          
              Higher distance =
              wider FOV =
              stars become visually smaller/farther.
          
              This is an actual camera projection change.
            */

            const t =
                value / 100;


            const minFOV =
                45;


            const maxFOV =
                115;


            camera.fov =
                THREE.MathUtils.lerp(
                    minFOV,
                    maxFOV,
                    t
                );


            camera.updateProjectionMatrix();


            /*
              Also change the real sphere radius.
            */

            currentRadius =
                THREE.MathUtils.lerp(
                    25,
                    1000,
                    t
                );


            if (
                insideSphere
            ) {

                insideSphere.scale.setScalar(
                    currentRadius
                );

            }


            if (
                outsideSphere
            ) {

                outsideSphere.scale.setScalar(
                    currentRadius
                );

            }

        }

        // =========================================================
        // DEVICE SENSOR
        // =========================================================

        function updateScreenOrientation() {

            if (
                screen.orientation &&
                typeof screen.orientation.angle ===
                "number"
            ) {

                screenAngle =
                    THREE.MathUtils.degToRad(
                        screen.orientation.angle
                    );

            }

            else if (
                typeof window.orientation ===
                "number"
            ) {

                screenAngle =
                    THREE.MathUtils.degToRad(
                        window.orientation
                    );

            }

            else {

                screenAngle =
                    0;

            }

        }


        function handleDeviceOrientation(
            event
        ) {

            if (
                !sensorEnabled
            ) {

                return;

            }


            if (
                event.alpha === null ||
                event.beta === null ||
                event.gamma === null
            ) {

                return;

            }


            updateScreenOrientation();


            const alpha =
                THREE.MathUtils.degToRad(
                    event.alpha
                );


            const beta =
                THREE.MathUtils.degToRad(
                    event.beta
                );


            const gamma =
                THREE.MathUtils.degToRad(
                    event.gamma
                );


            deviceEuler.set(
                beta,
                alpha,
                -gamma,
                "YXZ"
            );


            deviceQuaternion
                .setFromEuler(
                    deviceEuler
                );


            screenQuaternion
                .setFromAxisAngle(
                    axisZ,
                    -screenAngle
                );


            deviceQuaternion.multiply(
                screenQuaternion
            );


            correctionQuaternion
                .setFromAxisAngle(
                    axisX,
                    -Math.PI / 2
                );


            deviceQuaternion.multiply(
                correctionQuaternion
            );


            sensorQuaternion.copy(
                deviceQuaternion
            );


            if (
                !sensorInitialized
            ) {

                sensorReference
                    .copy(
                        sensorQuaternion
                    )
                    .invert();


                sensorInitialized =
                    true;


                showToast(
                    "Motion controls calibrated"
                );

            }

        }


        // =========================================================
        // APPLY SENSOR CAMERA
        // =========================================================

        function applySensorCamera() {

            if (
                !sensorEnabled ||
                !sensorInitialized ||
                !insideView ||
                isDragging
            ) {

                return;

            }


            camera.position.set(
                0,
                0,
                0.01
            );


            camera.quaternion
                .copy(
                    sensorReference
                )
                .multiply(
                    sensorQuaternion
                );

        }

        // =========================================================
        // PLAY VIDEO
        // =========================================================

        async function playVideo(
            index
        ) {

            const video =
                createVideoElement(
                    videoURLs[index]
                );


            await waitForVideoReady(
                video
            );


            /*
              Remove previous video.
            */

            if (
                currentVideo
            ) {

                try {

                    currentVideo.pause();

                }
                catch (_) { }


                currentVideo.remove();

            }


            if (
                currentVideoTexture
            ) {

                currentVideoTexture.dispose();

            }


            currentVideo =
                video;


            currentVideoIndex =
                index;


            currentVideoTexture =
                createVideoTexture(
                    currentVideo
                );


            /*
              Replace the sphere texture.
            */

            if (
                insideSphere
            ) {

                insideSphere.material.map =
                    currentVideoTexture;


                insideSphere.material.needsUpdate =
                    true;

            }


            if (
                outsideSphere
            ) {

                outsideSphere.material.map =
                    currentVideoTexture;


                outsideSphere.material.needsUpdate =
                    true;

            }


            currentVideo.muted =
                true;


            currentVideo.playsInline =
                true;


            currentVideo.loop =
                false;


            /*
              Listen once.
          
              handleVideoEnded() immediately installs the
              listener on the next video.
            */

            currentVideo.addEventListener(
                "ended",
                handleVideoEnded,
                {
                    once:
                        true
                }
            );


            currentVideo.currentTime =
                0;


            await currentVideo.play();

        }


        // =========================================================
        // VIDEO ENDED
        // =========================================================

        async function handleVideoEnded() {

            if (
                mediaMode !==
                "video"
            ) {

                return;

            }


            if (
                !videoURLs.length
            ) {

                return;

            }


            /*
              MODULO = ENDLESS LOOP.
            */

            const nextIndex =
                (
                    currentVideoIndex + 1
                ) %
                videoURLs.length;


            try {

                await playVideo(
                    nextIndex
                );

            }

            catch (error) {

                console.error(
                    "Video loop error:",
                    error
                );


                /*
                  Retry instead of stopping.
                */

                setTimeout(
                    () => {

                        playVideo(
                            nextIndex
                        ).catch(
                            console.error
                        );

                    },
                    500
                );

            }

        }


        // =========================================================
        // CREATE VIDEO
        // =========================================================

        function createVideoElement(
            url
        ) {

            const video =
                document.createElement(
                    "video"
                );


            video.src =
                url;


            video.preload =
                "auto";


            video.muted =
                true;


            video.playsInline =
                true;


            video.controls =
                false;


            video.loop =
                false;


            video.setAttribute(
                "playsinline",
                ""
            );


            video.style.position =
                "fixed";


            video.style.width =
                "1px";


            video.style.height =
                "1px";


            video.style.opacity =
                "0";


            video.style.pointerEvents =
                "none";


            document.body.appendChild(
                video
            );


            return video;

        }


        // =========================================================
        // VIDEO READY
        // =========================================================

        function waitForVideoReady(
            video
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    if (
                        video.readyState >= 3
                    ) {

                        resolve();

                        return;

                    }


                    const ready =
                        () => {

                            cleanup();

                            resolve();

                        };


                    const failed =
                        () => {

                            cleanup();

                            reject(
                                new Error(
                                    "Video failed to load."
                                )
                            );

                        };


                    function cleanup() {

                        video.removeEventListener(
                            "canplay",
                            ready
                        );


                        video.removeEventListener(
                            "error",
                            failed
                        );

                    }


                    video.addEventListener(
                        "canplay",
                        ready,
                        {
                            once:
                                true
                        }
                    );


                    video.addEventListener(
                        "error",
                        failed,
                        {
                            once:
                                true
                        }
                    );

                }
            );

        }


        // =========================================================
        // VIDEO TEXTURE
        // =========================================================

        function createVideoTexture(
            video
        ) {

            const texture =
                new THREE.VideoTexture(
                    video
                );


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.minFilter =
                THREE.LinearFilter;


            texture.magFilter =
                THREE.LinearFilter;


            texture.generateMipmaps =
                false;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.ClampToEdgeWrapping;


            return texture;

        }


        // =========================================================
        // STOP VIDEO
        // =========================================================

        function stopAllVideo() {

            if (
                currentVideo
            ) {

                try {

                    currentVideo.pause();

                }
                catch (_) { }


                currentVideo.remove();

            }


            if (
                currentVideoTexture
            ) {

                currentVideoTexture.dispose();

            }


            for (
                const url of videoURLs
            ) {

                try {

                    URL.revokeObjectURL(
                        url
                    );

                }
                catch (_) { }

            }


            videoFiles =
                [];

            videoURLs =
                [];

            currentVideoIndex =
                0;

            currentVideo =
                null;

            currentVideoTexture =
                null;

        }

        // =========================================================
        // CREATE SPHERE
        // =========================================================

        function createSpaceSphere(
            texture
        ) {

            if (
                !texture
            ) {

                return;

            }


            // -------------------------------------------------------
            // REMOVE OLD SPHERES
            // -------------------------------------------------------

            if (
                insideSphere
            ) {

                scene.remove(
                    insideSphere
                );


                insideSphere.geometry.dispose();

                insideSphere.material.dispose();

            }


            if (
                outsideSphere
            ) {

                scene.remove(
                    outsideSphere
                );


                outsideSphere.geometry.dispose();

                outsideSphere.material.dispose();

            }


            // -------------------------------------------------------
            // TEXTURE SETTINGS
            // -------------------------------------------------------

            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.ClampToEdgeWrapping;


            texture.minFilter =
                THREE.LinearFilter;


            texture.magFilter =
                THREE.LinearFilter;


            texture.generateMipmaps =
                false;


            texture.needsUpdate =
                true;


            currentTexture =
                texture;


            // =======================================================
            // INSIDE SPHERE
            // =======================================================

            const insideGeometry =
                new THREE.SphereGeometry(
                    1,
                    192,
                    96
                );


            insideGeometry.scale(
                -1,
                1,
                1
            );


            const insideMaterial =
                new THREE.MeshBasicMaterial({

                    map:
                        texture,

                    side:
                        THREE.FrontSide,

                    toneMapped:
                        false

                });


            insideSphere =
                new THREE.Mesh(
                    insideGeometry,
                    insideMaterial
                );


            insideSphere.name =
                "Space_Inside_Sphere";


            insideSphere.position.set(
                0,
                0,
                0
            );


            insideSphere.scale.setScalar(
                currentRadius
            );


            scene.add(
                insideSphere
            );


            // =======================================================
            // OUTSIDE SPHERE
            // =======================================================

            const outsideGeometry =
                new THREE.SphereGeometry(
                    1,
                    256,
                    128
                );


            const outsideMaterial =
                new THREE.MeshBasicMaterial({

                    map:
                        texture,

                    side:
                        THREE.FrontSide,

                    toneMapped:
                        false

                });


            outsideSphere =
                new THREE.Mesh(
                    outsideGeometry,
                    outsideMaterial
                );


            outsideSphere.name =
                "Space_3D_Outside_Sphere";


            outsideSphere.position.set(
                0,
                0,
                0
            );


            outsideSphere.rotation.set(
                0,
                0,
                0
            );


            outsideSphere.scale.setScalar(
                currentRadius
            );


            scene.add(
                outsideSphere
            );


            updateViewMode();

        }


        // =========================================================
        // GLB EXPORT
        // =========================================================

        downloadBtn.addEventListener(
            "click",
            async () => {

                if (
                    !currentTexture
                ) {

                    showToast(
                        "Load an image or video first."
                    );


                    return;

                }


                downloadBtn.disabled =
                    true;


                downloadBtn.textContent =
                    "Creating GLB...";


                let exportTexture =
                    null;


                try {

                    // ---------------------------------------------------
                    // VIDEO → CURRENT FRAME
                    // ---------------------------------------------------

                    if (
                        mediaMode ===
                        "video"
                    ) {

                        if (
                            !currentVideo ||
                            currentVideo.readyState < 2
                        ) {

                            throw new Error(
                                "Video frame isn't ready."
                            );

                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            currentVideo.videoWidth ||
                            2048;


                        canvas.height =
                            currentVideo.videoHeight ||
                            1024;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            currentVideo,
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        exportTexture =
                            new THREE.CanvasTexture(
                                canvas
                            );


                        exportTexture.colorSpace =
                            THREE.SRGBColorSpace;


                        exportTexture.minFilter =
                            THREE.LinearFilter;


                        exportTexture.magFilter =
                            THREE.LinearFilter;


                        exportTexture.generateMipmaps =
                            false;


                        showToast(
                            "Standard GLB cannot contain this live video playlist. Saving the current video frame as a 3D GLB.",
                            5000
                        );

                    }

                    else {

                        exportTexture =
                            currentTexture;

                    }


                    // ---------------------------------------------------
                    // OUTWARD 3D SPHERE
                    // ---------------------------------------------------

                    const geometry =
                        new THREE.SphereGeometry(
                            currentRadius,
                            256,
                            128
                        );


                    const material =
                        new THREE.MeshBasicMaterial({

                            map:
                                exportTexture,

                            side:
                                THREE.FrontSide,

                            toneMapped:
                                false

                        });


                    const mesh =
                        new THREE.Mesh(
                            geometry,
                            material
                        );


                    mesh.name =
                        "Space_3D_Sphere";


                    const exportScene =
                        new THREE.Scene();


                    exportScene.add(
                        mesh
                    );


                    // ---------------------------------------------------
                    // EXPORT
                    // ---------------------------------------------------

                    const exporter =
                        new GLTFExporter();


                    const result =
                        await new Promise(
                            (
                                resolve,
                                reject
                            ) => {

                                exporter.parse(

                                    exportScene,

                                    resolve,

                                    reject,

                                    {

                                        binary:
                                            true,

                                        embedImages:
                                            true,

                                        onlyVisible:
                                            true,

                                        maxTextureSize:
                                            8192

                                    }

                                );

                            }
                        );


                    const blob =
                        new Blob(
                            [result],
                            {
                                type:
                                    "model/gltf-binary"
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        url;


                    link.download =
                        mediaMode === "video"
                            ? "space-sphere-video-frame.glb"
                            : "space-sphere.glb";


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    link.remove();


                    setTimeout(
                        () => {

                            URL.revokeObjectURL(
                                url
                            );

                        },
                        10000
                    );


                    geometry.dispose();

                    material.dispose();


                    if (
                        exportTexture !==
                        currentTexture
                    ) {

                        exportTexture.dispose();

                    }


                    if (
                        mediaMode !==
                        "video"
                    ) {

                        showToast(
                            "3D Space GLB saved."
                        );

                    }

                    else {

                        showToast(
                            "3D GLB saved with the current video frame, not the live animation.",
                            5000
                        );

                    }


                    downloadBtn.textContent =
                        "GLB Downloaded ✓";


                    setTimeout(
                        () => {

                            downloadBtn.textContent =
                                "Download Space Sphere (.GLB)";

                        },
                        2500
                    );

                }

                catch (error) {

                    console.error(
                        "GLB export:",
                        error
                    );


                    showToast(
                        "GLB export failed: " +
                        error.message,
                        5000
                    );


                    downloadBtn.textContent =
                        "Download Space Sphere (.GLB)";

                }

                finally {

                    downloadBtn.disabled =
                        false;

                }

            }
        );


        // =========================================================
        // RESIZE
        // =========================================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio || 1,
                        2
                    )
                );


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // =========================================================
        // RENDER
        // =========================================================

        function animate() {

            requestAnimationFrame(
                animate
            );


            /*
              Motion is only applied in Inside View.
              Outside remains a true camera orbit.
            */

            if (
                sensorEnabled &&
                sensorInitialized &&
                insideView &&
                !isDragging
            ) {

                applySensorCamera();

            }


            renderer.render(
                scene,
                camera
            );

        }


        animate();

    </script>

</body>

</html>
