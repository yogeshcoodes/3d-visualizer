<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D Space Sphere</title>
    <style>
        /* GLOBAL & APP */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            touch-action: none;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* VIEWER */
        #viewer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        #viewer.dragging {
            cursor: none;
        }

        #viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* IMAGE NAV */
        #imageNav button {
            position: fixed;
            top: 50%;
            z-index: 90;
            width: 42px;
            min-width: 42px;
            height: 42px;
            min-height: 42px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .72);
            color: #111;
            font-size: 24px;
            line-height: 1;
            transform: translateY(-50%);
            pointer-events: auto;
            opacity: 1;
            transition: opacity .15s ease, transform .14s ease;
        }

        #imageNav button:hover {
            transform: translateY(-50%) scale(1.04);
        }

        #imageNav button:active {
            transform: translateY(-50%) scale(.96);
        }

        #previousImageBtn {
            left: max(12px, env(safe-area-inset-left));
        }

        #nextImageBtn {
            right: max(12px, env(safe-area-inset-right));
        }

        /* STATUS & ALERTS */
        #viewStatus {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 80;
            padding: 7px 12px;
            border-radius: 999px;
            color: rgba(255, 255, 255, .88);
            background: rgba(0, 0, 0, .36);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        #sensorStatus {
            position: absolute;
            top: calc(max(10px, env(safe-area-inset-top)) + 35px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 80;
            padding: 6px 10px;
            border-radius: 999px;
            color: rgba(255, 255, 255, .80);
            background: rgba(0, 0, 0, .28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 10px;
            pointer-events: none;
            user-select: none;
            display: none;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, .72);
            z-index: 200;
            pointer-events: none;
            opacity: 1;
            transition: opacity .22s ease;
        }

        #loading.hidden {
            opacity: 0;
        }

        #error {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 650px);
            padding: 20px;
            border-radius: 14px;
            color: #fff;
            background: rgba(25, 0, 0, .95);
            text-align: center;
            line-height: 1.5;
            display: none;
            z-index: 300;
        }

        #error code {
            font-family: Consolas, monospace;
        }

        #toast {
            position: absolute;
            left: 50%;
            bottom: calc(185px + env(safe-area-inset-bottom));
            transform: translate(-50%, 15px);
            z-index: 500;
            width: max-content;
            max-width: min(90vw, 560px);
            padding: 10px 14px;
            border-radius: 11px;
            color: #fff;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 11px;
            line-height: 1.35;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* VR PROMPT */
        #vrLandscapePrompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 16px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #vrLandscapePrompt.show {
            visibility: visible;
            opacity: 1;
            animation: vrPulse 2s infinite ease-in-out;
        }

        @keyframes vrPulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.08);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* CORNER BUTTONS */
        #fullscreenCornerBtn {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(60px + env(safe-area-inset-right));
            z-index: 1000;
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .5);
            color: #111;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            opacity: .5;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity .15s ease, transform .15s ease;
        }

        #fullscreenCornerBtn:hover {
            opacity: .7;
            transform: scale(1.04);
        }

        #fullscreenCornerBtn:active {
            transform: scale(.96);
        }

        #settingsBtn {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            z-index: 1000;
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .5);
            color: #111;
            font-size: 19px;
            line-height: 1;
            opacity: .5;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* SETTINGS PANEL */
        #settingsPanel {
            position: fixed;
            top: calc(60px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            z-index: 999;
            width: min(240px, calc(100vw - 24px));
            padding: 12px;
            border-radius: 12px;
            display: none;
            color: rgba(255, 255, 255, .92);
            background: rgba(0, 0, 0, .72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
        }

        #settingsPanel.open {
            display: block;
        }

        .settings-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .settings-toggle {
            display: block;
            width: 100%;
            min-height: 34px;
            margin-top: 8px;
            padding: 7px 9px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 9px;
            background: rgba(255, 255, 255, .10);
            color: rgba(255, 255, 255, .92);
            font-size: 10px;
            font-weight: 700;
            text-align: left;
            box-shadow: none;
            transition: background .14s ease, transform .14s ease;
            cursor: pointer;
        }

        .settings-toggle:hover {
            background: rgba(255, 255, 255, .16);
            transform: none;
        }

        .settings-toggle.active-toggle {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        #gyroSensitivitySlider {
            width: 100%;
            accent-color: white;
            margin-bottom: 12px;
        }

        #gyroSensitivityValue {
            color: rgba(255, 255, 255, .66);
            font-size: 10px;
            font-weight: 400;
        }

        /* CUSTOM DROPDOWN */
        .custom-dropdown {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
        }

        .dropdown-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 7px 9px;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background .14s ease;
        }

        .dropdown-header:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 9px;
            margin-top: 4px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .dropdown-list.open {
            display: flex;
        }

        .dropdown-item {
            padding: 8px 9px;
            font-size: 10px;
            color: #ccc;
            cursor: pointer;
            font-weight: 700;
            transition: background .1s ease, color .1s ease;
        }

        .dropdown-item:hover,
        .dropdown-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* BOTTOM UI */
        .ui {
            position: absolute;
            left: 50%;
            bottom: max(8px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(calc(100vw - 12px), 650px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
            pointer-events: none;
            opacity: 1;
            transition: opacity .35s ease;
        }

        .ui.idle {
            opacity: .40;
        }

        .ui:hover,
        .ui:focus-within {
            opacity: 1;
        }

        .title {
            color: rgba(255, 255, 255, .86);
            font-size: 12px;
            line-height: 1.3;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .95);
            pointer-events: none;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            pointer-events: auto;
        }

        /* BUTTONS */
        button {
            border: 0;
            outline: none;
            min-height: 38px;
            padding: 9px 13px;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, .94);
            color: #111;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 7px 24px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .85);
            transition: transform .14s ease, background .14s ease, opacity .14s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            transform: translateY(-1px);
            background: #fff;
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        /* CONTROL PANEL */
        #controlsPanel {
            width: min(100%, 520px);
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, .38);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            pointer-events: auto;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .slider-row:first-child {
            margin-top: 0;
        }

        .slider-label {
            flex: 0 0 88px;
            color: rgba(255, 255, 255, .92);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .slider-value {
            flex: 0 0 38px;
            color: rgba(255, 255, 255, .66);
            font-size: 10px;
            text-align: right;
        }

        .slider {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            cursor: pointer;
            accent-color: white;
        }

        /* FULLSCREEN MODE */
        html.fullscreen-mode,
        html.fullscreen-mode body,
        html.fullscreen-mode #app {
            width: 100%;
            height: 100%;
            min-height: 100%;
        }

        #app.fullscreen-active #viewStatus,
        #app.fullscreen-active #sensorStatus,
        #app.fullscreen-active .ui {
            display: none;
        }

        #app.fullscreen-active #fullscreenCornerBtn {
            display: flex;
        }

        #app.fullscreen-active #settingsBtn {
            display: flex;
        }

        #app.fullscreen-active.fullscreen-idle #fullscreenCornerBtn,
        #app.fullscreen-active.fullscreen-idle #settingsBtn,
        #app.fullscreen-active.fullscreen-idle #imageNav button,
        #app.fullscreen-active.fullscreen-idle #sensorStatus {
            opacity: 0;
            pointer-events: none;
        }

        /* RESPONSIVE */
        @media (max-width:600px) {
            .ui {
                width: calc(100vw - 10px);
                gap: 5px;
            }

            .title {
                font-size: 10px;
            }

            .control-row {
                gap: 5px;
            }

            button {
                min-height: 36px;
                padding: 8px 9px;
                font-size: 10px;
                border-radius: 9px;
            }

            #controlsPanel {
                padding: 7px 9px;
            }

            .slider-label {
                flex-basis: 74px;
                font-size: 9px;
            }

            .slider-value {
                flex-basis: 30px;
                font-size: 9px;
            }

            #fullscreenCornerBtn,
            #settingsBtn {
                width: 36px;
                height: 36px;
                min-width: 36px;
                min-height: 36px;
                top: calc(8px + env(safe-area-inset-top));
                font-size: 16px;
                border-radius: 9px;
            }

            #fullscreenCornerBtn {
                right: calc(52px + env(safe-area-inset-right));
            }

            #settingsBtn {
                right: calc(8px + env(safe-area-inset-right));
            }

            #settingsPanel {
                top: calc(52px + env(safe-area-inset-top));
            }

            #toast {
                bottom: calc(205px + env(safe-area-inset-bottom));
                font-size: 10px;
            }
        }

        @media (max-width:380px) {
            button {
                min-height: 34px;
                padding: 7px 8px;
                font-size: 9px;
            }

            .slider-label {
                flex-basis: 67px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="viewer"></div>
        <div id="imageNav" aria-label="Image navigation">
            <button id="previousImageBtn" type="button" aria-label="Previous image"><svg
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg></button>
            <button id="nextImageBtn" type="button" aria-label="Next image"><svg xmlns="http://www.w3.org/2000/svg"
                    width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6" />
                </svg></button>
        </div>

        <div id="viewStatus">INSIDE VIEW</div>
        <div id="sensorStatus">MOTION SENSOR ACTIVE</div>
        <div id="vrLandscapePrompt">Tilt your device (landscape) to experience</div>
        <div id="loading">Loading...</div>
        <div id="error"></div>
        <div id="toast"></div>
        <button id="fullscreenCornerBtn" aria-label="Exit Fullscreen">⛶</button>
        <button id="settingsBtn" type="button" aria-label="Settings">⚙</button>

        <!-- SETTINGS PANEL -->
        <div id="settingsPanel">
            <div class="settings-label"><span>Gyro Sensitivity</span><span id="gyroSensitivityValue">50%</span></div>
            <input id="gyroSensitivitySlider" type="range" min="0" max="100" value="50" step="1">

            <!-- VR Toggle -->
            <button id="vrToggle" class="settings-toggle" type="button">VR Split Screen: OFF</button>

            <!-- Audio Environment Controls -->
            <button id="reverbToggle" class="settings-toggle" type="button">Reverb: OFF</button>

            <div class="settings-label" style="margin-top: 8px;"><span>Acoustic Space</span></div>
            <div class="custom-dropdown" id="reverbDropdown">
                <div class="dropdown-header" id="reverbDropdownHeader">Concert Hall <span style="opacity: 0.5;">▼</span>
                </div>
                <div class="dropdown-list" id="reverbDropdownList">
                    <div class="dropdown-item" data-value="room">Room</div>
                    <div class="dropdown-item active" data-value="hall">Concert Hall</div>
                    <div class="dropdown-item" data-value="arena">Arena</div>
                    <div class="dropdown-item" data-value="cave">Deep Cave</div>
                </div>
            </div>

            <button id="muteAudioToggle" class="settings-toggle" type="button">Mute Audio: OFF</button>
        </div>

        <!-- BOTTOM UI -->
        <div class="ui" id="ui">
            <div class="title">Touch/Drag • 2-Finger Rotate • Scroll to Zoom</div>
            <div id="controlsPanel">
                <div id="distanceOnly" class="slider-row">
                    <div class="slider-label">Space Distance</div>
                    <input id="distanceSlider" class="slider" type="range" min="0" max="100" value="50" step="1">
                    <div id="distanceValue" class="slider-value">50</div>
                </div>
                <div id="frameStretchOnly" class="slider-row">
                    <div class="slider-label">Frame Stretch</div>
                    <input id="frameStretchSlider" class="slider" type="range" min="-60" max="100.2" value="100.1"
                        step="0.01">
                    <div id="frameStretchValue" class="slider-value">100%</div>
                </div>
                <div class="slider-row">
                    <div class="slider-label">Image X</div>
                    <input id="rotationXSlider" class="slider" type="range" min="-180" max="180" value="0" step="1">
                    <div id="rotationXValue" class="slider-value">0°</div>
                </div>
                <div class="slider-row">
                    <div class="slider-label">Image Y</div>
                    <input id="rotationYSlider" class="slider" type="range" min="-180" max="180" value="0" step="1">
                    <div id="rotationYValue" class="slider-value">0°</div>
                </div>
            </div>
            <div class="control-row">
                <button id="viewToggleBtn">Switch to Outside</button>
                <button id="sensorBtn">Enable Motion</button>
                <button id="fullscreenBtn">Fullscreen</button>
            </div>
            <div class="control-row">
                <button id="imageBtn">Choose Image</button>
                <button id="videoBtn">Choose Video(s)</button>
            </div>
            <div class="control-row">
                <button id="downloadBtn">Download GLB</button>
            </div>
        </div>

        <input id="imageInput" type="file" accept="image/*" style="display:none;">
        <input id="videoInput" type="file" accept="video/*" multiple style="display:none;">
    </div>

    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
